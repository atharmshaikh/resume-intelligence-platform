name: Zero-Trust Security CI

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.vscode/**'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.vscode/**'

permissions:
  contents: read

jobs:
  security-audit:
    name: "Zero-Trust Security & Build Audit"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
    - name: "Checkout Code (Pinned v4)"
      uses: actions/checkout@v4

    - name: "Setup Python ${{ matrix.python-version }}"
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: "Verify Supply Chain (Hash-Pinned Install)"
      run: |
        python -m pip install --upgrade pip
        # We enforce hash verification to prevent supply chain tampering
        python -m pip install --require-hashes -r ml-service/ml-engine/requirements-lock.txt

    - name: "Install Security Core"
      run: |
        python -m pip install bandit safety ruff pyright pytest pytest-cov

    - name: "Audit: Software Composition Analysis (Safety)"
      # Scans dependencies for known vulnerabilities
      run: |
        safety check -r ml-service/ml-engine/requirements-lock.txt

    - name: "Audit: Static Application Security Testing (Bandit)"
      # Scans code for security anti-patterns (hardcoded secrets, weak crypto)
      run: |
        bandit -r ml-service/ml-engine/ml_engine -c ml-service/ml-engine/.bandit.yaml

    - name: "Audit: Code Hygiene (Ruff)"
      # Ultra-fast linting and bug detection
      run: |
        ruff check ml-service/ml-engine/ml_engine

    - name: "Audit: Type Safety (Pyright)"
      # Ensures the ML Engine is logically sound and type-safe
      run: |
        pyright ml-service/ml-engine/ml_engine

    - name: "Logic Verification: Unit Tests (Pytest)"
      # Executes synthetic data tests to verify model logic without proprietary data
      run: |
        cd ml-service/ml-engine
        export PYTHONPATH=$PYTHONPATH:.
        pytest --cov=ml_engine tests/
