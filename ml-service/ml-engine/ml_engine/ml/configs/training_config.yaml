# =========================================================================
# Resume ML Engine - Advanced Configuration (Industry Standard)
# =========================================================================

# Current active model architecture
active_model: "logistic_regression"

# ── Deployment Controls ──────────────────────────────────────────────────
# The engine uses this ID to load the specific version from artifacts/
deployment:
  active_model_id: "LOGISTIC_REGRESSION_ACTIVE"
  model_metadata:
    name: "Standard LR Engine"
    version: "1.0.1"
    description: "Stabilized 12-feature Logistic Regression for true applicant ranking."

# ── Runtime & Storage ────────────────────────────────────────────────────
runtime:
  storage:
    uploads: "data/uploads"
    processed: "data/processed"
    results: "data/results"
  cleanup:
    retention_hours: 168
    enabled: false

# ── Inference & Business Rules ───────────────────────────────────────────
# Thresholds and capacity limits for the 3-tier routing system.
inference_rules:
  tier_thresholds:
    shortlisted: 0.70
    manual_review: 0.45
  limits:
    max_shortlisted: 10
    max_manual_review: 20
  hard_requirements:
    require_contact: true
    min_projects: 1
    required_skills: []

# ── Pipeline Parameters ──────────────────────────────────────────────────
pipeline:
  n_samples: 2000
  test_size: 0.20
  random_state: 42
  regenerate_data: true

# ── Hyperparameters ──────────────────────────────────────────────────────
models:
  random_forest:
    n_estimators: 300
    max_depth: 12
    min_samples_leaf: 3
    min_samples_split: 6
    max_features: "sqrt"
    class_weight: "balanced"
    n_jobs: -1

  xgboost:
    learning_rate: 0.1
    max_depth: 6
    n_estimators: 200
    subsample: 0.8
    colsample_bytree: 0.8
    eval_metric: "mlogloss"
